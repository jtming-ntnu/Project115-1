<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>任務森林｜扭蛋養樹與毛孩</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f6ea;--card:#fff;--ink:#22352c;--mut:#5f7a6c;--g:#2f9e6e;--gd:#1f6b4f;--pink:#ff6f91;--sun:#ffc93c;--lil:#7b6cf6;--line:#d3e8da;--soft:#f2faf4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#112018;--card:#1b2e24;--ink:#e6f4ea;--mut:#9bb8a8;--line:#2c4739;--soft:#16271e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#112018;--card:#1b2e24;--ink:#e6f4ea;--mut:#9bb8a8;--line:#2c4739;--soft:#16271e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
html,body{height:100%;overflow:hidden}
.wrap{max-width:1100px;margin:auto;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:12px;display:grid;gap:12px;grid-template-columns:1fr;grid-template-rows:auto minmax(0,46dvh) minmax(0,1fr);grid-template-areas:"top" "world" "tasks"}
@media(min-width:900px){.wrap{grid-template-columns:1.1fr .9fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "tasks world"}}
@media(max-width:600px){.top p{display:none}h1{font-size:22px}.card{padding:12px}.pill{padding:6px 10px;font-size:15px}.meter small{display:none}.meter{margin-top:6px}}
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:26px;color:var(--gd)}
.top p{margin:2px 0 0;color:var(--mut);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:99px;background:var(--sun);color:#4a3600;font-size:18px}
.pill.bump{animation:bump .5s}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:16px}
h2{margin:0 0 10px;font-size:19px}
#world{grid-area:world;display:flex;flex-direction:column;min-height:0}#tasks{grid-area:tasks;display:flex;flex-direction:column;min-height:0}#gacha,#daily,#bk{text-align:center;position:relative;width:100%;max-width:340px;max-height:94dvh;overflow:auto}#gov,#dov,#bov{z-index:40}
#bk textarea{display:block;width:100%;margin:8px 0;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--soft);font-size:12px;word-break:break-all;resize:vertical}#bk h3{margin:18px 0 0;font-size:16px}#bk .btn{width:100%}
/* scene */
.scene{position:relative;flex:1;min-height:110px;border-radius:20px;overflow:hidden;background:linear-gradient(#8fd6ff,#e9fbff 64%,#8fd694 64%,#59b06a)}
.sun{position:absolute;right:16px;top:10px;font-size:38px}
.cloud{position:absolute;font-size:34px;animation:drift 30s linear infinite}
.hill{position:absolute;bottom:-40px;left:-10%;width:70%;height:110px;border-radius:50%;background:#6cc47b}
#tree{position:absolute;left:2%;bottom:0;width:60%;height:100%;transform-origin:50% 92%;cursor:pointer}
#tree.boing{animation:boing .6s}
#pet{position:absolute;right:9%;bottom:18px;line-height:1;cursor:pointer;transform-origin:bottom;animation:bob 1.7s ease-in-out infinite;transition:font-size .4s}
#pet.hop{animation:hop .7s}
.bubble{position:absolute;right:4%;top:56px;max-width:46%;padding:6px 12px;border-radius:14px;background:#fff;color:#22352c;font-size:13px;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.meter{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;margin-top:10px;font-size:14px}
.meter b{font-weight:400}
.bar{height:12px;border-radius:9px;background:var(--soft);border:1px solid var(--line);overflow:hidden;grid-column:2}
.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.m-tree i{background:linear-gradient(90deg,#8fe08f,#2f9e6e)}.m-pet i{background:linear-gradient(90deg,#ffd36b,#ff8a4c)}
.meter small{grid-column:2;color:var(--mut)}
/* tasks */
.add{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.add input,.add select{padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--soft)}
.add input:focus,.add select:focus{outline:3px solid var(--lil);border-color:transparent}
.btn{padding:10px 18px;border:0;border-radius:14px;background:var(--g);color:#fff;font-size:16px;box-shadow:0 4px 0 var(--gd);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--lil);outline-offset:2px}
.hint{display:none;margin:8px 0 0;font-size:13px;color:var(--lil)}.hint.on{display:block}
.hint button{border:0;background:none;color:inherit;text-decoration:underline}
#list{margin-top:12px;display:grid;align-content:start;gap:7px;flex:1;min-height:0;overflow:auto;padding:2px}
.task{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:16px;border:2px solid var(--line);background:var(--soft);animation:pop .3s}
.task.l0{border-color:var(--lil);background:color-mix(in srgb,var(--lil) 10%,var(--card))}
.task.l1{border-color:#7fd1a5}
.task.l2{border-style:dashed}
.task.done{opacity:.55}.task.done .nm{text-decoration:line-through}
.task input{width:22px;height:22px;accent-color:var(--g);flex:none}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.l0 .nm{font-size:17px}.l2 .nm{font-size:14px}
.cnt{font-style:normal;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--card);border:1px solid var(--line)}
.rw{font-size:12px;color:var(--mut);white-space:nowrap}
.task button{border:0;background:var(--card);border-radius:10px;width:28px;height:28px;color:var(--mut)}
.task button:hover{background:var(--pink);color:#fff}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.foot{margin-top:10px;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}.fa{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.foot button{border:0;background:none;color:var(--mut);text-decoration:underline}
/* gacha */
.machine{width:210px;margin:6px auto 0;position:relative}
.globe{height:150px;border-radius:50% 50% 42% 42%;border:7px solid var(--pink);position:relative;overflow:hidden;background:radial-gradient(circle at 30% 25%,#fff 0,#fff0 14%),linear-gradient(145deg,#e4f8ff,#a7e1ee)}
.cap{position:absolute;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,var(--c) 50%,#fff 50%);box-shadow:inset -3px -4px 6px #0003;animation:idle 2.6s ease-in-out infinite alternate}
.base{height:96px;margin-top:-8px;border-radius:20px 20px 28px 28px;background:linear-gradient(#ff8fa8,#e0476b);position:relative;box-shadow:0 8px 0 #b3314f}
.knob{position:absolute;left:26px;top:20px;width:56px;height:56px;border-radius:50%;border:4px solid #b3314f;background:radial-gradient(#fff3b0,var(--sun));display:grid;place-items:center;transition:transform .9s cubic-bezier(.5,0,.3,1)}
.knob:after{content:"";width:34px;height:10px;border-radius:9px;background:#fff;border:2px solid #c98a00}
.knob.turn{transform:rotate(540deg)}
.chute{position:absolute;right:26px;top:26px;width:60px;height:46px;border-radius:12px 12px 16px 16px;background:#4d1a2a;border:4px solid #ffd0a0;display:grid;place-items:center}
#drop{width:32px;height:32px;border-radius:50%;opacity:0;background:linear-gradient(180deg,var(--c,#8fe08f) 50%,#fff 50%)}
#drop.go{animation:drop .6s cubic-bezier(.3,1.5,.5,1) forwards}
.machine.shake .globe{animation:shake .3s 3}
.machine.shake .cap{animation:chaos .22s infinite alternate}
#spin{margin-top:16px;width:100%;max-width:280px;padding:13px;font-size:18px;background:var(--pink);box-shadow:0 5px 0 #b3314f}
#spin:disabled{opacity:.45;pointer-events:none}
#spinAll{display:block;margin:10px auto 0;width:100%;max-width:280px;padding:11px;font-size:16px;background:var(--lil);box-shadow:0 5px 0 #4b3fc0}#spinAll:disabled{opacity:.45;pointer-events:none}
.odds{margin:10px 0 0;font-size:13px;color:var(--mut)}
.gbtn{position:relative;width:54px;height:54px;border-radius:50%;border:3px solid var(--pink);background:var(--card);font-size:27px;display:grid;place-items:center;box-shadow:0 4px 0 #b3314f;transition:transform .15s}.gbtn:hover{transform:rotate(-8deg) scale(1.08)}.gbtn.ready{animation:wob 1.8s infinite}.gbtn b{position:absolute;right:-6px;top:-6px;min-width:22px;padding:0 6px;border-radius:99px;background:var(--pink);color:#fff;font-size:13px;font-weight:400;line-height:22px}.gx{position:absolute;right:12px;top:10px;border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;color:var(--mut)}
@keyframes wob{0%,70%,100%{transform:none}78%{transform:rotate(-12deg)}86%{transform:rotate(12deg)}94%{transform:rotate(-6deg)}}
.tabs{display:flex;gap:6px;margin-top:8px}.sc{flex:1;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:3px 0;font-size:20px;line-height:1.2}.sc small{display:block;font-size:11px;color:var(--mut)}.sc.on{border-color:var(--g);background:var(--card);box-shadow:0 3px 0 var(--g)}.sc:disabled{opacity:.5;cursor:not-allowed}
.gbtn.d{border-color:var(--g);box-shadow:0 4px 0 var(--gd)}.gbtn.d b{background:#e8384f}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;padding:12px;margin-top:10px;border:2px solid var(--line);border-radius:18px;background:var(--soft)}.q .e{font-size:30px}.q p{margin:0;color:var(--mut);font-size:13px}.q.ok{opacity:.6}.q .btn{padding:8px 14px;font-size:15px}.q .btn:disabled{opacity:.5;box-shadow:none}
.cl{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--mut)}.cl[data-s=ok]{border-color:var(--g);color:var(--g)}.cl[data-s=sync]{border-color:var(--sun)}.cl[data-s=off]{border-style:dashed}
@media(max-width:600px){.cl small{display:none}}
/* popup */
.ov{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50;padding:16px}.ov.on{display:grid}
.box{background:var(--card);border-radius:30px;padding:26px 24px;text-align:center;max-width:340px;width:100%;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.box .big{font-size:84px;line-height:1.1;animation:bob 1.2s ease-in-out infinite}
.box h3{margin:6px 0 2px;font-size:22px}.box p{margin:4px 0;color:var(--mut)}
.up{color:var(--g);font-size:17px;margin-top:8px!important}
.fx{position:fixed;z-index:99;pointer-events:none;font-size:22px;animation:fly .95s cubic-bezier(.15,.9,.3,1) forwards}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;transition:.3s;z-index:60;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(560px)}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes hop{30%{transform:translateY(-40px) scale(1.1,.9)}60%{transform:scale(1.1,.9)}}
@keyframes boing{30%{transform:scale(1.1,.88)}60%{transform:scale(.94,1.1)}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes bump{40%{transform:scale(1.25) rotate(-4deg)}}
@keyframes idle{to{transform:translateY(-5px) rotate(8deg)}}
@keyframes shake{25%{transform:translate(-6px,2px) rotate(-3deg)}75%{transform:translate(6px,-2px) rotate(3deg)}}
@keyframes chaos{to{transform:translate(10px,-34px) rotate(80deg)}}
@keyframes drop{from{transform:translateY(-34px) scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.2);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:flex;align-items:center;gap:12px"><button class="gbtn d" id="dOpen" aria-label="開啟每日任務" title="每日任務">📅<b id="dBadge">0</b></button><div><h1>任務森林</h1><p>完成任務、扭蛋，培育四個場景的植物與夥伴</p></div></div>
    <div style="display:flex;align-items:center;gap:12px"><button class="cl" id="cloudSt" style="display:none" data-s="sync" title="雲端存檔狀態（點一下重新同步）">☁️<small id="cloudTx"> 連線中</small></button><div class="pill" id="pill">🎟️ 扭蛋券 <b id="tk">0</b></div><button class="gbtn" id="gOpen" aria-label="開啟扭蛋機" title="開啟扭蛋機">🎰<b id="gBadge">0</b></button></div>
  </header>

  <section class="card" id="world">
    <div class="scene" id="sceneBox">
      <div class="sun" id="sun">☀️</div>
      <div class="cloud" style="top:18px;left:0">☁️</div>
      <div class="cloud" style="top:56px;left:0;animation-delay:-14s;font-size:26px;opacity:.8">☁️</div>
      <div class="hill" id="hill"></div>
      <div id="tree" title="戳戳小樹"></div>
      <div class="bubble" id="bub"></div>
      <div id="pet" title="摸摸毛孩"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="meter m-tree"><b id="tName">🌱 種子</b><div class="bar"><i id="tBar"></i></div><small id="tTxt"></small></div>
    <div class="meter m-pet"><b id="pName">🥚 神祕蛋</b><div class="bar"><i id="pBar"></i></div><small id="pTxt"></small></div>
  </section>

  <section class="card" id="tasks">
    <h2>我的任務</h2>
    <div class="add">
      <input id="inp" maxlength="60" placeholder="寫下一個任務，按 Enter 新增" aria-label="任務名稱">
      <select id="lv" aria-label="任務層級"><option value="0">🌳 大任務</option><option value="1" selected>🌿 小任務</option><option value="2">🍃 子任務</option></select>
      <button class="btn" id="addBtn">新增</button>
    </div>
    <p class="hint" id="hint"></p>
    <div id="list"></div>
    <div class="foot"><span>大任務 +3、小任務 +2、子任務 +1 張券</span><span class="fa"><button id="bkOpen">備份／還原</button><button id="clrDone">清除已完成</button><button id="clrAll">清空清單</button><button id="reset">重新開始</button></span></div>
  </section>

  <div class="ov" id="gov"><section class="card" id="gacha" role="dialog" aria-label="森林扭蛋機">
    <button class="gx" id="gClose" aria-label="關閉扭蛋機">✕</button>
    <h2>森林扭蛋機</h2>
    <div class="machine" id="mach">
      <div class="globe" id="globe"></div>
      <div class="base"><div class="knob" id="knob"></div><div class="chute"><div id="drop"></div></div></div>
    </div>
    <button class="btn" id="spin">扭一下！</button>
    <button class="btn" id="spinAll">一鍵扭完</button>
    <p class="odds">綠色道具讓植物長大，橘色道具讓夥伴長大。目前培育中：<b id="gTarget"></b><br>連續 6 抽沒出稀有，下一抽必出稀有。</p>
  </section></div>
</div>

<div class="ov" id="bov"><section class="card" id="bk" role="dialog" aria-label="備份與還原">
  <button class="gx" id="bClose" aria-label="關閉備份視窗">✕</button>
  <h2>備份與還原</h2>
  <p class="odds">備份碼包含所有任務與培育進度，貼到另一台裝置或另一個網址就能還原。</p>
  <textarea id="bkOut" readonly rows="3" aria-label="備份碼"></textarea>
  <button class="btn" id="bCopy">複製備份碼</button>
  <h3>還原進度</h3>
  <textarea id="bkIn" rows="3" placeholder="貼上備份碼，再按還原" aria-label="貼上備份碼"></textarea>
  <button class="btn" id="bRestore" style="background:var(--lil);box-shadow:0 4px 0 #4b3fc0">還原</button>
</section></div>
<div class="ov" id="dov"><section class="card" id="daily" role="dialog" aria-label="每日任務">
  <button class="gx" id="dClose" aria-label="關閉每日任務">✕</button>
  <h2>每日任務</h2>
  <p class="odds">每天 0 點重置，完成就能多拿扭蛋券</p>
  <div id="dList"></div>
</section></div>
<div class="ov" id="ov"><div class="box">
  <div class="big" id="pE"></div><h3 id="pN"></h3><p id="pD"></p><p class="up" id="pU"></p>
  <button class="btn" id="pOk" style="margin-top:14px">收下！</button>
</div></div>
<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const L=[{i:"🌳",t:3},{i:"🌿",t:2},{i:"🍃",t:1}];
const PRIZES=[
 {n:"晨露",i:"💧",k:"tree",v:1,w:30,c:"#6fd0ff"},
 {n:"陽光碎片",i:"☀️",k:"tree",v:2,w:16,c:"#8fe08f"},
 {n:"魔法肥料",i:"🧪",k:"tree",v:4,w:5,r:1,c:"#3fbf7f"},
 {n:"野莓",i:"🍓",k:"pet",v:1,w:30,c:"#ff9a6b"},
 {n:"小魚乾",i:"🐟",k:"pet",v:2,w:16,c:"#ffc24d"},
 {n:"蜂蜜蛋糕",i:"🍰",k:"pet",v:4,w:5,r:1,c:"#ff7a3d"},
 {n:"彩虹星塵",i:"🌈",k:"both",v:3,w:3,r:1,c:"#b78cff"}];
const TT=[2,5,9,14],PT=[2,6,12],MUL=[1,1.4,1.8,2.2];
const th=(i,a)=>a.map(x=>Math.round(x*MUL[i]));
const PS=[46,54,64,78];
const LINES=[["咚…咚…有東西在動！","好暖和，快孵出來了…"],["嗨！你是我的主人嗎？","肚子餓餓，想吃點心！"],["我學會新把戲了，看我！","今天也一起加油吧！"],["我是最強的夥伴，謝謝你！","全世界都看得到我，超閃亮！"]];
const SC=[
{n:"森林",ic:"🌳",pl:"小樹",pn:"孔雀",sky:"#8fd6ff,#e9fbff 64%,#8fd694 64%,#59b06a",hill:"#6cc47b",sun:"☀️",dc:"☁️",svg:treeSVG,P:["🌱 種子","🌿 嫩芽","🌳 小樹苗","🌲 綠蔭樹","🌸 開花神木"],A:["🥚","🐣","🐥","🦚"],AN:["神祕蛋","破殼寶寶","活力小雞","孔雀王"]},

 $("mach").classList.remove("shake");void $("mach").offsetWidth;$("mach").classList.add("shake");$("knob").classList.add("turn");tone([180,220,180,240,200,260]);
 setTimeout(()=>{
  const n=S.tickets,got=[],ups=[],cnt={};S.tickets=0;S.pulls+=n;
  for(let j=0;j<n;j++){const p=pick();S.dry=p.r?0:S.dry+1;got.push(p);cnt[p.n]=(cnt[p.n]||0)+1;ups.push(...applyPrize(p))}
  $("pE").textContent=got.some(p=>p.r)?"🎊":"🎁";$("pN").textContent="一鍵扭完 "+n+" 顆！";
  $("pD").textContent=PRIZES.filter(p=>cnt[p.n]).map(p=>(p.r?"⭐":"")+p.i+p.n+" ×"+cnt[p.n]).join("、");
  $("pU").innerHTML=ups.join("<br>");
  $("ov").classList.add("on");$("pOk").focus();
  fx(innerWidth/2,innerHeight/2,["🌟","🎊","✨","🎉"],16);tone([523,659,784,1046,1318]);
  $("knob").classList.remove("turn");$("mach").classList.remove("shake");
  lastK="both";lastI=S.grow;busy=false;renderAll()},1400)}

 $("ov").classList.remove("on");$("gov").classList.remove("on");

{let ct=null;const b=$("clrAll");b.onclick=()=>{if(!S.tasks.length){toast("清單已經是空的");return}if(!ct){b.textContent="再按一次確認清空";ct=setTimeout(()=>{ct=null;b.textContent="清空清單"},3000);return}clearTimeout(ct);ct=null;b.textContent="清空清單";const n=S.tasks.length;S.tasks=[];clearParent();renderAll();toast("已清空 "+n+" 項任務，扭蛋券與成長都保留")}}

{let rt2=null;const b=$("bRestore");b.onclick=()=>{
 const raw=$("bkIn").value.trim();let o;
